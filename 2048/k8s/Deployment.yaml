apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-2048
  namespace: game-2048
  labels:
    app: game-2048
spec:
  replicas: 3
  selector: 
    matchLabels:
      app: game-2048
  template:
    metadata:
      labels:
        app: game-2048
    spec:
      containers:
        - name: game-2048 
          image: game-2048:latest
          imagePullPolicy: Never   # <--- local image imported via `k3s ctr images import'
          ports:
            - containerPort: 5000    # <-- change this if your Dockerfile EXPOSEs a different port
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 5000    # <-- change this if your Dockerfile EXPOSEs a different port  NOT 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 5000    # <-- change this if your Dockerfile EXPOSEs a different port NOT 80
            initialDelaySeconds: 5
            periodSeconds: 10

